name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo al mismo PR cancela el run anterior: no tiene sentido pagar
# minutos por validar un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fijado a propósito y en un único sitio. Sin pin, una regla nueva de ruff
  # rompe el CI un día que nadie ha tocado el repo (ya pasó una vez).
  RUFF_VERSION: "0.16.3"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uvx ruff@${{ env.RUFF_VERSION }} check --output-format=github .
      - run: uvx ruff@${{ env.RUFF_VERSION }} format --check .

  typecheck:
    name: "Typecheck mypy — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, orchestrator]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: Sync
        working-directory: services/${{ matrix.service }}
        run: uv sync --frozen
      - name: mypy
        working-directory: services/${{ matrix.service }}
        run: uv run mypy

  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, orchestrator]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: Sync
        working-directory: services/${{ matrix.service }}
        run: uv sync --frozen
      - name: pytest
        working-directory: services/${{ matrix.service }}
        # Los tests no tienen red: todo lo externo va con fixtures grabadas.
        run: uv run pytest -q --cov --cov-report=xml --cov-report=term-missing
      - name: Subir cobertura
        uses: codecov/codecov-action@v7
        with:
          files: services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test -- --run
      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Comprobación de integración de la topología completa: que los 5 servicios
      # del compose construyen juntos. El cacheado fino vive en `publish`, que es
      # donde se paga de verdad (multi-arch).
      - name: Build de los 5 servicios
        run: docker compose build

  publish:
    name: Publicar en GHCR
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: services/api
          - service: orchestrator
            context: services/orchestrator
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # arm64 incluido: el proyecto se desarrolla en ARM y ya arrastra
          # restricciones por ello (greenlet<3.5, imagen PostGIS multi-arch).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

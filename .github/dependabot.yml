# Un PR por ecosistema y ventana, no uno por dependencia.
#
# La primera versión de este fichero agrupaba solo `minor` y `patch`, así que cada
# actualización *major* se salía del grupo y abría su propio PR: 13 PRs de golpe en la
# primera ejecución. Aquí cada ecosistema tiene un único grupo con `patterns: ["*"]`,
# que cubre también los majors.
#
# Las reglas `ignore` no son pereza: protegen pines que existen por un motivo concreto,
# documentado en cada caso. Sin ellas, dependabot propone deshacerlos y el CI no siempre
# tiene un test que lo detecte.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/services/api"
    schedule:
      interval: "weekly"
    groups:
      api:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "uv"
    directory: "/services/orchestrator"
    schedule:
      interval: "weekly"
    groups:
      orchestrator:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # greenlet >= 3.5 no publica rueda para linux/aarch64 y rompe el build en ARM.
      # El pin vive en pyproject.toml (constraint-dependencies).
      - dependency-name: "greenlet"
        versions: [">=3.5"]
      # mlflow está fijado a <3 a propósito: la 3.x cambia la API de logging y de Model
      # Registry, y hoy NO hay ningún test que entrene un modelo, así que el CI pasaría
      # en verde con `make entrenar-ml` roto. Cuando exista ese test, se sube a mano.
      - dependency-name: "mlflow"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Los majors del frontend NO vienen por aquí. Agrupados salía un PR que subía a la
      # vez React 19, TypeScript 7, Vite 8, ESLint 10, react-leaflet 5 y vitest 5: un
      # cambio imposible de revisar, que además rompía el CI sin decir cuál de los seis
      # lo rompía. Las migraciones de major se hacen a mano y por bloques.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    directories:
      - "/services/api"
      - "/services/orchestrator"
      - "/services/mlflow"
      - "/frontend"
    schedule:
      interval: "monthly"
    groups:
      imagenes:
        patterns: ["*"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Node 22 y Python 3.12 están fijados en el CI, en los Dockerfile y en
      # requires-python. Subir el major de la imagen sin subir los otros tres deja el
      # entorno de build y el de CI desalineados, que es peor que ir un poco por detrás.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Ojo con el esquema de versiones: en `python:3.14-slim` el major es el 3, así que
      # 3.12 → 3.14 cuenta como *minor* y se colaba pese a ser justo lo que esta regla
      # quería evitar (PR #14). Medido: con 3.14 la imagen ni se construye — mlflow 2.x
      # arrastra pyarrow, que aún no publica rueda para 3.14 e intenta compilarla sin
      # cmake. Se sube cuando suban también CI, Dockerfiles y requires-python.
      - dependency-name: "python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

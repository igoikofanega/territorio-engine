[project]
name = "territorio-pipelines"
version = "0.1.0"
description = "Pipelines de datos (Dagster): ingesta y fusión de la matriz municipio×año"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyaxis>=0.4",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "mlflow>=2.17,<3",
    "libpysal>=4.9",
    "esda>=2.5",
    "rasterio>=1.4",
    "pyproj>=3.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# greenlet 3.5.x aún no publica wheel para linux/aarch64 (VM ARM); fijamos < 3.5.
constraint-dependencies = ["greenlet<3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/territorio_pipelines"]

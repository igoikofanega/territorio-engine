[project]
name = "territorio-pipelines"
version = "0.1.0"
description = "Pipelines de datos (Dagster): ingesta y fusión de la matriz municipio×año"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/territorio_pipelines"]

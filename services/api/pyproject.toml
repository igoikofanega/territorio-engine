[project]
name = "territorio-api"
version = "0.1.0"
description = "API de lectura de territorio-engine (FastAPI async)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "httpx>=0.27",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/territorio_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Arranque deliberadamente permisivo: mypy entra como red de seguridad contra
# errores obvios, no como un muro que obligue a anotar 1.600 líneas de golpe.
# Se endurece por módulo a medida que se refactorizan (ver docs/adr).
[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Topología MVP — 4 servicios. Levanta todo con:  make up
services:
  db:
    # imresamu/postgis = PostGIS oficial pero multi-arch (incluye linux/arm64).
    image: imresamu/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-territorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-territorio}
      POSTGRES_DB: ${POSTGRES_DB:-territorio}
    ports:
      # Puerto del HOST configurable (5432 suele estar ocupado por otros Postgres).
      # Los demás servicios hablan con db:5432 por la red interna, no por este.
      - "${DB_PORT:-5544}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-territorio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://territorio:territorio@db:5432/territorio}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  orchestrator:
    build: ./services/orchestrator
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://territorio:territorio@db:5432/territorio}
      AEMET_API_KEY: ${AEMET_API_KEY:-}
      # Proveedor de LLM para la capa de noticias (cualquiera compatible con OpenAI).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODELO: ${LLM_MODELO:-}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Instancia de Dagster en un volumen compartido, no en /tmp del contenedor. Sin
      # esto, un `docker compose run` arranca un contenedor nuevo con su propia
      # instancia vacía: la materialización corre a ciegas, no sale en la UI de :3010 y
      # su historial se pierde al terminar. Con el volumen, cualquier ejecución —desde
      # la UI o desde un one-off— es la misma instancia y se ve en el mismo sitio.
      DAGSTER_HOME: /dagster_home
    ports:
      - "${DAGSTER_PORT:-3010}:3000"
    volumes:
      - ./raw:/data/raw  # landing zone inmutable de datos crudos
      # El golden set de noticias tiene que acabar en el repositorio (se versiona), no
      # en un volumen: es lo que hace reproducible la medición de la extracción.
      - ./docs/golden:/app/docs/golden
      - dagster_home:/dagster_home
    depends_on:
      db:
        condition: service_healthy

  mlflow:
    build: ./services/mlflow
    ports:
      - "${MLFLOW_PORT:-5055}:5000"
    volumes:
      - mlflow_data:/mlflow

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db_data:
  mlflow_data:
  dagster_home:
